<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <!-- Áp dụng dark mode SỚM NHẤT có thể (trước khi trình duyệt kịp vẽ khung sáng mặc định) — đặt
       ngay đầu <head>, đồng bộ (không async/defer), để tránh hiện tượng "nháy sáng" 1 khoảnh khắc
       rồi mới chuyển tối. Ưu tiên lựa chọn người dùng đã lưu; nếu chưa từng chọn thì theo đúng
       cài đặt hệ điều hành/trình duyệt (prefers-color-scheme) và tự cập nhật nếu cài đặt đó đổi. -->
  <script>
    (function () {
      var KEY = "kana_quiz_theme_v1";
      var media = window.matchMedia("(prefers-color-scheme: dark)");
      function apply(theme) {
        document.documentElement.setAttribute("data-theme", theme);
      }
      var stored = localStorage.getItem(KEY);
      apply(stored || (media.matches ? "dark" : "light"));
      if (!stored) {
        media.addEventListener("change", function (e) {
          if (!localStorage.getItem(KEY)) apply(e.matches ? "dark" : "light");
        });
      }
    })();
  </script>

  <!-- Tailwind CSS (CDN, biên dịch JIT ngay trên trình duyệt) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font UI (Inter, theo design system) + font hỗ trợ tiếng Nhật rõ nét (Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    rel="stylesheet" />

  <!-- Bảng màu theo "YAMATE Kana Design System v1.0" (teal sáng + pastel sakura/yuzu) — vẫn giữ
       nguyên TÊN key (teal/saffron/cream/ink/status) như cũ nên app.js không cần sửa gì, chỉ đổi
       giá trị hex bên dưới là toàn bộ app đổi màu. teal-700 neo vào đúng màu chủ đạo #0ABAB5 của
       design system (thay vì theo đúng số thứ tự 700 trong file gốc) vì đó là màu nút/CTA chính
       đang dùng khắp app (27 chỗ), không phải màu 700 tối nhất của họ.

       cream/ink/status/white trỏ vào CSS variable (định nghĩa ở thẻ <style> bên dưới, 2 bộ giá trị
       light/dark) thay vì hex thẳng — nhờ vậy TOÀN BỘ app đổi màu theo dark mode mà không phải sửa
       app.js (vẫn dùng đúng tên class cũ). Format "rgb(var(--x) / <alpha-value>)" là cú pháp Tailwind
       yêu cầu để các modifier độ mờ kiểu bg-status-ok/10 vẫn hoạt động với màu CSS variable. teal/
       saffron giữ hex thẳng, KHÔNG đổi theo theme vì là màu thương hiệu, đủ nổi bật trên cả 2 nền. -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: { 50: '#F0FDFC', 100: '#E6FAF9', 200: '#CFF5F3', 300: '#B2F0EE', 400: '#7FEFEC', 500: '#66E3DF', 600: '#14D4CE', 700: '#0ABAB5', 800: '#099E9A', 900: '#077F7B' },
            saffron: { 100: '#FEF3C7', 200: '#FDE68A', 300: '#FCD34D', 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706', 700: '#B45309' },
            cream: {
              DEFAULT: 'rgb(var(--color-bg) / <alpha-value>)',
              surface: 'rgb(var(--color-bg-alt) / <alpha-value>)',
              border: 'rgb(var(--color-border) / <alpha-value>)',
            },
            ink: {
              DEFAULT: 'rgb(var(--color-text) / <alpha-value>)',
              soft: 'rgb(var(--color-text-soft) / <alpha-value>)',
              faint: 'rgb(var(--color-text-faint) / <alpha-value>)',
            },
            status: {
              ok: 'rgb(var(--color-status-ok) / <alpha-value>)',
              busy: 'rgb(var(--color-status-busy) / <alpha-value>)',
            },
            // Token RIÊNG cho nền card/input (KHÔNG dùng lại tên "white") — vì "white" còn được
            // dùng cho text-white (chữ trắng đặt trên nút teal-700/status-ok/busy, những màu KHÔNG
            // đổi theo theme). Nếu trỏ cả "white" vào biến CSS này, dark mode sẽ vô tình đổi luôn
            // màu chữ trên các nút đó (từng bị bug: nút "Test Final" ở dark mode ra chữ tối trên
            // nền cũng tối chuyển sáng — do bg-ink và text-white cùng đổi ngược nhau).
            card: 'rgb(var(--color-surface) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          // Thang elevation 3 mức (thay vì dùng shadow/shadow-md/shadow-lg/shadow-xl mặc định của
          // Tailwind lẫn lộn không theo hệ thống nào) — dùng dần cho code mới, không đổi hàng loạt
          // chỗ đang dùng shadow mặc định để tránh rủi ro không cần thiết.
          boxShadow: {
            e1: '0 1px 3px rgba(0,0,0,0.06)', // nút, phần tử nổi nhẹ
            e2: '0 4px 12px rgba(0,0,0,0.08)', // card, tile
            e3: '0 8px 24px rgba(0,0,0,0.12)', // modal, phần tử nổi cao nhất
          },
        },
      },
    };
  </script>

  <style>
    /* Biến màu nền/chữ cho dark mode — dạng "R G B" (không dấu phẩy) để dùng được với cú pháp
       rgb(var(--x) / <alpha-value>) ở tailwind.config phía trên. Giá trị light bám theo đúng thang
       slate của Tailwind (cream/ink vốn đã là slate-50/100/200 và slate-400/600/800); dark đảo
       ngược theo đúng thang đó (slate-900 → slate-100) cho nhất quán. teal/saffron KHÔNG có ở đây
       vì giữ nguyên giữa 2 theme (xem comment ở tailwind.config). */
    :root {
      --color-bg: 248 250 251;
      /* #F8FAFB */
      --color-bg-alt: 241 245 249;
      /* #F1F5F9 (slate-100) */
      --color-border: 226 232 240;
      /* #E2E8F0 (slate-200) */
      --color-border-hover: 203 213 225;
      /* #CBD5E1 (slate-300) */
      --color-text: 30 41 59;
      /* #1E293B (slate-800) */
      --color-text-soft: 71 85 105;
      /* #475569 (slate-600) */
      --color-text-faint: 148 163 184;
      /* #94A3B8 (slate-400) */
      --color-surface: 255 255 255;
      /* #FFFFFF — nền card/modal/FAB */
      --color-status-ok: 22 163 74;
      /* #16A34A (green-600) */
      --color-status-busy: 220 38 38;
      /* #DC2626 (red-600) */
    }

    :root[data-theme="dark"] {
      --color-bg: 15 23 42;
      /* #0F172A (slate-900) */
      --color-bg-alt: 30 41 59;
      /* #1E293B (slate-800) */
      --color-border: 51 65 85;
      /* #334155 (slate-700) */
      --color-border-hover: 71 85 105;
      /* #475569 (slate-600) */
      --color-text: 241 245 249;
      /* #F1F5F9 (slate-100) */
      --color-text-soft: 203 213 225;
      /* #CBD5E1 (slate-300) */
      --color-text-faint: 148 163 184;
      /* #94A3B8 (slate-400) — giữ nguyên độ sáng trung bình, đủ tương phản trên nền tối */
      --color-surface: 30 41 59;
      /* #1E293B (slate-800) — card "nổi" nhẹ trên nền slate-900 */
      --color-status-ok: 34 197 94;
      /* #22C55E (green-500) — sáng hơn 1 bậc so với light, dễ đọc trên nền tối */
      --color-status-busy: 239 68 68;
      /* #EF4444 (red-500) */
    }

    /* Token thời lượng/easing cho animation — gom về 1 chỗ thay vì mỗi nơi tự hardcode 1 số khác
       nhau. Micro = tap/hover nhỏ, transition = toast/modal, complex = hiệu ứng nhiều bước (lật thẻ).
       Bounce dùng cho hiệu ứng "nảy vào" (toast, modal); standard dùng cho tap/hover thường. */
    :root {
      --motion-micro: 150ms;
      --motion-transition: 300ms;
      --motion-complex: 500ms;
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Tôn trọng cài đặt "giảm hiệu ứng chuyển động" của hệ điều hành/trình duyệt — tắt gần hết
       animation/transition trang trí, giữ lại thay đổi trạng thái (chỉ mất phần "chuyển động"). */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    html,
    body {
      overscroll-behavior: none;
      /* Tắt "font boosting"/text-size-adjust tự động của trình duyệt mobile thật — thuật toán
         này chỉ chạy trên thiết bị cảm ứng thật (không tái hiện được qua devtools/headless test)
         và có thể tự phóng to chữ (kéo theo cả các phần tử co giãn theo, vd input) ngoài ý muốn. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* min-height thật của viewport mobile (trừ thanh địa chỉ), thay cho 100vh của Tailwind
       — 100vh tính theo lúc thanh địa chỉ ẩn hẳn nên luôn thừa ra vài chục px lúc mới load. */
    #app {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Hiệu ứng rung nhẹ khi ghép/chọn sai */
    @keyframes shake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(4px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-8px);
      }

      40%,
      60% {
        transform: translateX(8px);
      }
    }

    .animate-shake {
      animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
    }

    /* Hiệu ứng lật thẻ flashcard (3D flip) */
    .flip-scene {
      perspective: 1400px;
      /* dvh thay vì vh của Tailwind (max-h-[45vh] đã bỏ khỏi class list) — vh tính theo lúc
         thanh trình duyệt ẩn hẳn nên trên máy thật thẻ bị cao hơn thực tế, đè lên input bên dưới. */
      max-height: 45vh;
      max-height: 45dvh;
    }

    .flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform var(--motion-complex) cubic-bezier(.4, .15, .2, 1);
      transform-style: preserve-3d;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-face--back {
      transform: rotateY(180deg);
    }

    /* Ô nhập kana (flashcard + luyện gõ) — reset native styling bằng CSS thường (không qua class
       Tailwind JIT), vì các input này được chèn động qua innerHTML và trên một số trình duyệt/
       thiết bị thật đã thấy bị native styling làm cao bất thường, đẩy lệch layout. Kích thước
       (padding/font-size) vẫn để class Tailwind trong app.js quyết định — chặn phóng to tự động
       chính là text-size-adjust:100% đặt ở html,body phía trên. */
    .kana-text-input {
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
      display: block;
      line-height: 1.3;
      margin: 0;
    }

    /* Toast notification — neo giữa mép trên, không che nội dung bên dưới */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 108px);
      left: 50%;
      width: max-content;
      max-width: min(88vw, 340px);
      background: #0ABAB5;
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      z-index: 999;
      pointer-events: none;
      animation: toastIn var(--motion-transition) var(--ease-bounce) forwards;
    }

    @keyframes toastIn {
      from {
        transform: translate(-50%, -16px);
        opacity: 0;
      }

      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    @keyframes toastOut {
      from {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      to {
        transform: translate(-50%, -16px);
        opacity: 0;
      }
    }

    .toast.exiting {
      animation: toastOut 0.2s ease-in forwards;
    }

    /* Nút feedback nổi — nằm ngoài #app nên không bị xoá mỗi khi render() thay màn hình.
       Kiểu outline hồng để nổi hẳn lên khỏi nền (bản solid teal cũ bị hòa màu với header/nút khác). */
    .feedback-fab {
      position: fixed;
      right: 16px;
      /* 56px chừa đủ chỗ cho footer bản quyền (~38px cao) luôn nằm dưới cùng mọi màn hình,
         không thì FAB đè lên chữ footer — đã thấy lỗi này trên máy thật */
      bottom: calc(56px + env(safe-area-inset-bottom, 0px));
      z-index: 46;
      width: 50px;
      height: 50px;
      border-radius: 9999px;
      background: rgb(var(--color-surface));
      color: #EC4899;
      border: 2px solid #EC4899;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      transition: transform var(--motion-micro) var(--ease-standard), background var(--motion-micro) var(--ease-standard);
    }

    /* #FDF2F8 (hồng rất nhạt) chỉ hợp trên nền sáng — dark mode dùng lớp phủ hồng trong suốt thay
       vì 1 màu đặc, để không bị chói trên nền tối. */
    .feedback-fab:hover {
      background: #FDF2F8;
      transform: scale(1.06);
    }

    :root[data-theme="dark"] .feedback-fab:hover {
      background: rgba(236, 73, 153, 0.18);
    }

    .feedback-fab:active {
      transform: scale(0.92);
    }

    /* Nền mờ phía sau mini menu — tách menu khỏi nội dung trang (đỡ đè chữ lên nút bên dưới khi
       màn hình dài hơn 1 viewport), đồng thời bấm vào đây cũng đóng menu luôn. */
    .feedback-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 20, 0.35);
      z-index: 43;
      animation: feedbackFadeIn 0.15s ease-out;
    }

    .feedback-menu-backdrop.hidden {
      display: none;
    }

    /* Mini menu bật lên từ FAB — 2 lựa chọn: mời cà phê / gửi góp ý */
    .feedback-menu {
      position: fixed;
      right: 16px;
      bottom: calc(56px + 62px + env(safe-area-inset-bottom, 0px));
      z-index: 45;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      animation: feedbackMenuIn 0.18s var(--ease-bounce);
    }

    .feedback-menu.hidden {
      display: none;
    }

    @keyframes feedbackMenuIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .feedback-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      background: rgb(var(--color-surface));
      color: rgb(var(--color-text));
      border: none;
      border-radius: 9999px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      transition: transform var(--motion-micro) var(--ease-standard);
    }

    .feedback-menu-item:active {
      transform: scale(0.95);
    }

    .feedback-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 20, 0.6);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: feedbackFadeIn 0.2s ease-out;
    }

    @keyframes feedbackFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes feedbackScaleIn {
      from {
        transform: scale(0.92);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .feedback-modal-overlay.hidden {
      display: none;
    }

    .feedback-modal-box {
      background: rgb(var(--color-surface));
      border-radius: 22px;
      width: 100%;
      max-width: 560px;
      max-height: min(90vh, 720px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
      animation: feedbackScaleIn 0.25s var(--ease-bounce);
    }

    .feedback-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid rgb(var(--color-border));
      flex-shrink: 0;
      background: rgb(var(--color-bg-alt));
    }

    .feedback-modal-title {
      font-weight: 800;
      font-size: 15px;
      color: rgb(var(--color-text));
    }

    .feedback-modal-close {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      border: none;
      background: rgb(var(--color-border));
      color: rgb(var(--color-text));
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform var(--motion-micro) var(--ease-standard), background var(--motion-micro) var(--ease-standard);
    }

    .feedback-modal-close:hover {
      background: rgb(var(--color-border-hover));
    }

    .feedback-modal-close:active {
      transform: scale(0.9);
    }

    .feedback-modal-body {
      flex: 1;
      overflow: auto;
      background: rgb(var(--color-bg-alt));
      -webkit-overflow-scrolling: touch;
    }

    .feedback-modal-body iframe {
      width: 100%;
      height: 100%;
      min-height: 520px;
      border: none;
      display: block;
    }

    /* Modal "mời cà phê" — nhỏ gọn hơn modal Google Form, chỉ QR + text + nút tải */
    .coffee-modal-body {
      padding: 24px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgb(var(--color-bg-alt));
      overflow: auto;
    }

    /* Nền QR luôn TRẮNG cứng bất kể theme — mã QR cần nền sáng để scan được, không đổi theo dark mode. */
    .coffee-qr-image {
      width: 100%;
      max-width: 260px;
      border-radius: 16px;

    .coffee-modal-text {

      font-size: 14px;
      font-weight: 600;
      color: rgb(var(--color-text-soft));

    .coffee-download-btn {

      color: #fff;

      padding: 12px 22px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform var(--motion-micro) var(--ease-standard);

    .coffee-download-btn:active {

    }

</head>

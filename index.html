<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1C564C" />

    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />

  <!-- Open Graph — hiện preview khi chia sẻ link (Zalo, Messenger, Discord...) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="YAMATE Kana — Vào Học Đi Đồ Lười 🔥" />
  <meta property="og:description"
    content="Học Hiragana &amp; Katakana kiểu lầy lội: flashcard, ghép cặp, thi 20 câu — không nuông chiều ai hết." />
  <meta property="og:locale" content="vi_VN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="YAMATE Kana — Vào Học Đi Đồ Lười 🔥" />
  <meta name="twitter:description"
    content="Học Hiragana &amp; Katakana kiểu lầy lội: flashcard, ghép cặp, thi 20 câu — không nuông chiều ai hết." />

  <!-- Tailwind CSS (CDN, biên dịch JIT ngay trên trình duyệt) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font UI (Plus Jakarta Sans) + font hỗ trợ tiếng Nhật rõ nét (Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    rel="stylesheet" />

  <!-- Mở rộng bảng màu Tailwind theo design system tham khảo (teal / saffron / cream / ink) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: { 50: '#F1F7F5', 100: '#E3EFEC', 200: '#BFDAD4', 300: '#86B8AF', 400: '#4E9488', 500: '#2F7A6E', 600: '#22635A', 700: '#1C564C', 800: '#1A4E47', 900: '#143F39' },
            saffron: { 100: '#FEF7E3', 200: '#FDEFC7', 300: '#FCE4A0', 400: '#FBD97E', 500: '#F6C445', 600: '#EDB428', 700: '#C9971C' },
            cream: { DEFAULT: '#F4F1E9', surface: '#FBFAF6', border: '#EDE9DD' },
            ink: { DEFAULT: '#232823', soft: '#6F746D', faint: '#9A9E96' },
            status: { ok: '#2E7D32', busy: '#C62828' },
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    html,
    body {
      overscroll-behavior: none;
      /* Tắt "font boosting"/text-size-adjust tự động của trình duyệt mobile thật — thuật toán
         này chỉ chạy trên thiết bị cảm ứng thật (không tái hiện được qua devtools/headless test)
         và có thể tự phóng to chữ (kéo theo cả các phần tử co giãn theo, vd input) ngoài ý muốn. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* min-height thật của viewport mobile (trừ thanh địa chỉ), thay cho 100vh của Tailwind
       — 100vh tính theo lúc thanh địa chỉ ẩn hẳn nên luôn thừa ra vài chục px lúc mới load. */
    #app {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Hiệu ứng rung nhẹ khi ghép/chọn sai */
    @keyframes shake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(4px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-8px);
      }

      40%,
      60% {
        transform: translateX(8px);
      }
    }

    .animate-shake {
      animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
    }

    /* Hiệu ứng lật thẻ flashcard (3D flip) */
    .flip-scene {
      perspective: 1400px;
      /* dvh thay vì vh của Tailwind (max-h-[45vh] đã bỏ khỏi class list) — vh tính theo lúc
         thanh trình duyệt ẩn hẳn nên trên máy thật thẻ bị cao hơn thực tế, đè lên input bên dưới. */
      max-height: 45vh;
      max-height: 45dvh;
    }

    .flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(.4, .15, .2, 1);
      transform-style: preserve-3d;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-face--back {
      transform: rotateY(180deg);
    }

    /* Ô nhập kana (flashcard + luyện gõ) — reset native styling bằng CSS thường (không qua class
       Tailwind JIT), vì các input này được chèn động qua innerHTML và trên một số trình duyệt/
       thiết bị thật đã thấy bị native styling làm cao bất thường, đẩy lệch layout. Kích thước
       (padding/font-size) vẫn để class Tailwind trong app.js quyết định — chặn phóng to tự động
       chính là text-size-adjust:100% đặt ở html,body phía trên. */
    .kana-text-input {
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
      display: block;
      line-height: 1.3;
      margin: 0;
    }

    /* Toast notification — neo giữa mép trên, không che nội dung bên dưới */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 108px);
      left: 50%;
      width: max-content;
      max-width: min(88vw, 340px);
      background: #1C564C;
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      z-index: 999;
      pointer-events: none;
      animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes toastIn {
      from {
        transform: translate(-50%, -16px);
        opacity: 0;
      }

      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    @keyframes toastOut {
      from {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      to {
        transform: translate(-50%, -16px);
        opacity: 0;
      }
    }

    .toast.exiting {
      animation: toastOut 0.2s ease-in forwards;
    }

    /* Nút feedback nổi — nằm ngoài #app nên không bị xoá mỗi khi render() thay màn hình */
    .feedback-fab {
      position: fixed;
      right: 16px;
      /* 56px chừa đủ chỗ cho footer bản quyền (~38px cao) luôn nằm dưới cùng mọi màn hình,
         không thì FAB đè lên chữ footer — đã thấy lỗi này trên máy thật */
      bottom: calc(56px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      width: 50px;
      height: 50px;
      border-radius: 9999px;
      background: #1C564C;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .feedback-fab:hover {
      transform: scale(1.06);
    }

    .feedback-fab:active {
      transform: scale(0.92);
    }

    .feedback-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 20, 0.6);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: feedbackFadeIn 0.2s ease-out;
    }

    @keyframes feedbackFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes feedbackScaleIn {
      from {
        transform: scale(0.92);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .feedback-modal-overlay.hidden {
      display: none;
    }

    .feedback-modal-box {
      background: #fff;
      border-radius: 22px;
      width: 100%;
      max-width: 560px;
      max-height: min(90vh, 720px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
      animation: feedbackScaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .feedback-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid #EDE9DD;
      flex-shrink: 0;
      background: #FBFAF6;
    }

    .feedback-modal-title {
      font-weight: 800;
      font-size: 15px;
      color: #232823;
    }

    .feedback-modal-close {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      border: none;
      background: #EDE9DD;
      color: #232823;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .feedback-modal-close:hover {
      background: #E2DDCE;
    }

    .feedback-modal-close:active {
      transform: scale(0.9);
    }

    .feedback-modal-body {
      flex: 1;
      overflow: auto;
      background: #FBFAF6;
      -webkit-overflow-scrolling: touch;
    }

    .feedback-modal-body iframe {
      width: 100%;
      height: 100%;
      min-height: 520px;
      border: none;
      display: block;
    }
  </style>
</head>

<body class="bg-cream text-ink font-sans">
  <!-- Toàn bộ giao diện được render động vào đây bởi app.js. -->
  <!-- class (độ rộng khung) được app.js gán động theo từng màn hình, xem containerClass() trong app.js -->
  <div id="app" class="min-h-screen max-w-md mx-auto"></div>

  <!-- Nút feedback nổi + modal Google Form — cố tình đặt ngoài #app để sống sót qua mọi lần render() -->
  <button id="feedback-fab" class="feedback-fab" aria-label="feedback" title="feedback">💌</button>

  <div id="feedback-modal-overlay" class="feedback-modal-overlay hidden">
    <div class="feedback-modal-box" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
      <div class="feedback-modal-header">
        <span id="feedback-modal-title" class="feedback-modal-title">💌 Feedback</span>
        <button id="feedback-modal-close" class="feedback-modal-close" aria-label="Đóng">✕</button>
      </div>
      <div class="feedback-modal-body">
        <iframe id="feedback-modal-iframe"
          data-src="https://docs.google.com/forms/d/e/1FAIpQLSfJ019D4SlF-BXtFqXZ4-slX4g8YeXRKeO6j0zeUxmJyFfu9A/viewform?embedded=true"
          title="Google Form Feedback"></iframe>
      </div>
    </div>
  </div>

  <!-- Convert romaji <-> kana cho tính năng Luyện Gõ (wanakana.bind trong app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <!-- Dữ liệu bảng chữ cái -->
  <script src="data.js"></script>
  <!-- Ngân hàng đề Test Final -->
  <script src="examData.js"></script>
  <!-- Logic ứng dụng -->
  <script src="app.js"></script>
</body>

</html>
